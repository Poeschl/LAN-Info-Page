# Don't rename this file to .yaml, as the release-drafter action expects yml extension
---
name-template: "$RESOLVED_VERSION"
tag-template: "$RESOLVED_VERSION"
change-template: "- $TITLE @$AUTHOR ([#$NUMBER]($URL))"
category-template: "### $TITLE"
sort-direction: ascending

categories:
  - title: "🚨 Breaking changes"
    semver-increment: "major"
    when:
      labels:
        - "breaking-change"
  - title: "✨ New features"
    semver-increment: "minor"
    when:
      labels:
       - "new-feature"
  - title: "🐛 Bug fixes"
    semver-increment: "patch"
    when:
      labels:
        - "bugfix"
  - title: "🚀 Enhancements"
    semver-increment: "patch"
    when:
      labels:
        - "enhancement"
        - "refactor"
  - title: "🔨 Maintenance"
    semver-increment: "patch"
    when:
      labels:
        - "maintenance"
  - title: "📚 Documentation"
    semver-increment: "patch"
    when:
      labels:
        - "documentation"
  - title: "⬆️ Dependency updates"
    semver-increment: "patch"
    when:
      labels:
      - "dependencies"
  # Labels that only affect version resolution, without their own changelog section
  - type: "version-resolver"
    semver-increment: "major"
    when:
      label: "major-release"
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      label: "minor-release"
  - type: "version-resolver"
    semver-increment: "patch"

template: |
  ## Changes in this version

  $CHANGES
